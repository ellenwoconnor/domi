[project]
name = "domi-support-agent"
version = "0.1.0"
description = "Triage agent for support@domicircles.com"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Tracing and experiments in Arize AX. Install with: uv sync --extra arize
arize = [
  "arize-otel",
  "openinference-instrumentation-anthropic",
  "arize",
  "pandas",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
