# domicircles.com landing pages and app-link files. See web/README.md.
name = "domicircles"
main = "src/index.js"
compatibility_date = "2026-10-01"

routes = [{ pattern = "domicircles.com", custom_domain = true }]

[vars]
# The Convex deployment the pages read from. Use the production URL once it exists.
CONVEX_URL = "https://rugged-dragon-667.convex.cloud"
# Android signing-key SHA-256 fingerprint(s), comma-separated, from `npx eas-cli credentials` (later).
ANDROID_SHA256 = ""
# TestFlight public link for the external tester group (testflight.apple.com/join/...).
# Shown on /beta and on invite and listing pages. Empty: they say to ask for the link.
TESTFLIGHT_URL = ""

# Report alerts (src/alerts.js): sends from alerts@domicircles.com through
# Cloudflare Email Routing. The recipient is the REPORT_ALERT_TO secret.
[[send_email]]
name = "REPORT_EMAIL"

# Install match (src/match.js): the code a visitor tapped, kept an hour under a
# hashed IP so the app can find it on first open. Create once with
#   npx wrangler kv namespace create MATCHES
# and paste the id it prints below. Optional secret: npx wrangler secret put MATCH_SALT
# Until then /m does nothing and people type the code instead.
[[kv_namespaces]]
binding = "MATCHES"
id = "74143f95bb8a4494ad7bfc9065c09f17"
